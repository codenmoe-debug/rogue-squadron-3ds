name: Extract Game Bin from ROM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-bin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm build-essential

      - name: Extract ROM to game.bin
        run: |
          # Jika file ROM N64 bernama baserom.z64 berada di root repositori
          python port3ds/build_from_rom.py *.z64 --no-pull

      - name: Upload game.bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-bin-output
          path: |
            game.bin
            port3ds/game.bin
