name: Build 3DS Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 3DS Dependencies
        shell: bash
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-portlibs

      - name: Build 3DS Binary
        shell: bash
        run: |
          # Menjalankan build menggunakan Makefile utama
          make

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-executable
          path: |
            *.3dsx
            *.cia
            *.elf
            *.bin
