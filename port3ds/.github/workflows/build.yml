name: Build 3DS Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 3DS Dependencies
        shell: bash
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-portlibs

      - name: Build Project
        shell: bash
        run: |
          make -f Makefile 3ds # atau sesuaikan perintah build (misal: cmake -B build && cmake --build build)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-game-build
          path: |
            *.3dsx
            *.cia
            *.elf
            *.bin
